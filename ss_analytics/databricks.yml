# This is a Declarative Automation Bundle definition for ss_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: ss_analytics
  uuid: be02a872-16a4-421c-bf9c-9d074e6b1ad6

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-c27f0a79-9bcb.cloud.databricks.com
    variables:
      catalog: dev_ss_analytics
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-c27f0a79-9bcb.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/sheray@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/sheray@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dev_ss_analytics
      schema: prod
    permissions:
      - user_name: sheray@gmail.com
        level: CAN_MANAGE
